<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestão de Frota</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            font-family: system-ui, sans-serif;
            color: #e2e8f0;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #020617;
            padding: 20px;
            border-right: 1px solid #1e293b;
            height: 100vh;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .menu a {
            display: block;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            color: #94a3b8;
            text-decoration: none;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            background: #1e293b;
            color: white;
        }

        .main {
            flex: 1;
            padding: 25px;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 28px;
            font-weight: bold;
        }

        .chart {
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            height: 300px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">Frota<span style="color:#e2e8f0;">Manager</span></div>

    <div class="menu">
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="#">Veículos</a>
        <a href="#">Alugueres</a>
        <a href="#">Manutenções</a>
        <a href="#">Documentos</a>
        <a href="#">Localização</a>
        <a href="#">Utilizadores</a>
        <a href="#">Relatórios</a>
        <a href="/auth/logout" style="color:#f87171;">Terminar Sessão</a>
    </div>
</div>

<div class="main">
    <div class="title">Visão Geral da Frota</div>

    <div class="grid">
        <div class="card">
            <h3>Total de Veículos</h3>
            <div class="value">32</div>
        </div>

        <div class="card">
            <h3>Disponíveis</h3>
            <div class="value">18</div>
        </div>

        <div class="card">
            <h3>Alugados</h3>
            <div class="value">10</div>
        </div>

        <div class="card">
            <h3>Em Manutenção</h3>
            <div class="value">3</div>
        </div>
    </div>

    <div class="chart">
        <h3 style="color:#94a3b8;">Estado da Frota</h3>
        <p style="margin-top:20px;color:#64748b;">(Aqui podes meter um gráfico real mais tarde)</p>
    </div>
</div>

</body>
</html>
