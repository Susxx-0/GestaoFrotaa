<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sessão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h2>Iniciar Sessão</h2>

        <form action="/auth/login" method="POST">
            <input type="email" name="email" placeholder="E-mail" required class="campo">
            <input type="password" name="senha" placeholder="Palavra-passe" required class="campo">
            <button type="submit" class="botao botao-verde">Avançar</button>
        </form>

        <p class="link"><a href="/register.html">Não tem conta? Registe-se</a></p>
        <p class="link"><a href="/menu.html">Voltar ao Menu Principal</a></p>
    </div>

    <script>
    document.querySelectorAll(".botao").forEach(btn => {
        btn.addEventListener("click", function(e) {
            let rect = this.getBoundingClientRect();
            this.style.setProperty("--x", (e.clientX - rect.left) + "px");
            this.style.setProperty("--y", (e.clientY - rect.top) + "px");
        });
    });
    </script>
</body>
</html>
