<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação 2FA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box box-large">
        <h2>Introduza o código de verificação</h2>
        <p>Enviámos um código de 6 dígitos para o seu <strong>e-mail</strong>.</p>

        <form action="/auth/verificar-2fa" method="POST">
            <input type="text" name="codigo" placeholder="000000" maxlength="6" required class="campo-codigo">
            <button type="submit" class="botao botao-amarelo">Verificar e Entrar</button>
        </form>

        <p class="link"><a href="/menu.html">Cancelar e Voltar ao Menu Principal</a></p>
    </div>

    <script>
    document.querySelectorAll(".botao").forEach(btn => {
        btn.addEventListener("click", function(e) {
            let rect = this.getBoundingClientRect();
            this.style.setProperty("--x", (e.clientX - rect.left) + "px");
            this.style.setProperty("--y", (e.clientY - rect.top) + "px");
        });
    });
    </script>
</body>
</html>
